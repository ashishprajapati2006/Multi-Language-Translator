services:
  - type: web
    name: multi-language-translator-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180 app:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FRONTEND_URL
        value: "*"
      - key: HF_MODEL_REPO
        value: ashishprajapati2006/translator-model
      - key: WARMUP_ON_START
        value: "false"
